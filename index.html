<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Medico Prep Academy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --link: var(--tg-theme-link-color, #38bdf8);
      --btn-bg: var(--tg-theme-button-color, #2563eb);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: #334155;
      --accent: #06b6d4;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      padding-bottom: 40px;
      line-height: 1.4;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 0.8rem;
      color: var(--hint);
      margin-top: 4px;
    }

    /* Progress Banner */
    .progress-banner {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #38bdf8, #10b981);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Course Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--hint);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--btn-bg);
      color: var(--btn-text);
      border-color: var(--btn-bg);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* Search & Filter Bar */
    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--link);
    }

    .search-box .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      color: var(--hint);
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-chip {
      padding: 5px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--hint);
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-chip.active {
      background: var(--link);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--link);
    }

    /* Accordions & Sections */
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .section-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background: rgba(255, 255, 255, 0.02);
    }

    .section-title {
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      color: var(--hint);
    }

    .arrow-icon {
      font-size: 0.75rem;
      transition: transform 0.25s ease;
      color: var(--hint);
    }

    .section-card.expanded .arrow-icon {
      transform: rotate(180deg);
    }

    .section-content {
      display: none;
      padding: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section-card.expanded .section-content {
      display: block;
    }

    /* Item Card */
    .item-card {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      gap: 10px;
    }

    .item-card:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.06);
    }

    .item-card.completed {
      opacity: 0.6;
    }

    .check-btn {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--hint);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .item-card.completed .check-btn {
      background: var(--success);
      border-color: var(--success);
    }

    .check-btn::after {
      content: "✓";
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      display: none;
    }

    .item-card.completed .check-btn::after {
      display: block;
    }

    .item-icon {
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .item-sub {
      font-size: 0.7rem;
      color: var(--hint);
      display: flex;
      gap: 8px;
    }

    .play-btn {
      padding: 6px 12px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s, opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .play-btn:active {
      transform: scale(0.96);
    }
  </style>

    let currentCourse = "Prep Resolve 2.0";
    let activeFilter = "all";
    let searchQuery = "";
    let completedItems = new Set(JSON.parse(localStorage.getItem("medico_completed") || "[]"));

    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      if (Telegram.WebApp.headerColor) {
        Telegram.WebApp.setHeaderColor('secondary_bg_color');
      }
    }

    function haptic() {
      if (window.Telegram && window.Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
        Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
    }

    function saveCompleted() {
      localStorage.setItem("medico_completed", JSON.stringify([...completedItems]));
      updateProgress();
    }

    function toggleComplete(id, event) {
      event.stopPropagation();
      haptic();
      const strId = String(id);
      if (completedItems.has(strId)) {
        completedItems.delete(strId);
      } else {
        completedItems.add(strId);
      }
      saveCompleted();
      
      const card = document.getElementById("item-" + strId);
      if (card) {
        card.classList.toggle("completed", completedItems.has(strId));
      }
    }

    function openItem(link) {
      haptic();
      if (window.Telegram && window.Telegram.WebApp && Telegram.WebApp.openTelegramLink) {
        Telegram.WebApp.openTelegramLink(link);
      } else {
        window.open(link, '_blank');
      }
    }

    function selectCourse(courseName) {
      haptic();
      currentCourse = courseName;
      document.getElementById("tab-resolve").classList.toggle("active", courseName === "Prep Resolve 2.0");
      document.getElementById("tab-version11").classList.toggle("active", courseName === "Prep Version XI");
      render();
    }

    function setFilter(filterType) {
      haptic();
      activeFilter = filterType;
      document.getElementById("chip-all").classList.toggle("active", filterType === "all");
      document.getElementById("chip-video").classList.toggle("active", filterType === "video");
      document.getElementById("chip-pdf").classList.toggle("active", filterType === "pdf");
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById("search-input").value.toLowerCase().trim();
      render();
    }

    function toggleSection(sectionIdx) {
      haptic();
      const secCard = document.getElementById("sec-" + sectionIdx);
      if (secCard) {
        secCard.classList.toggle("expanded");
      }
    }

    function updateProgress() {
      let total = 0;
      let done = 0;
      for (const c in COURSES_DATA) {
        for (const sec of COURSES_DATA[c]) {
          for (const it of sec.items) {
            total++;
            if (completedItems.has(String(it.id))) {
              done++;
            }
          }
        }
      }
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById("progress-percent").textContent = done + " / " + total + " (" + pct + "%)";
      document.getElementById("progress-bar-fill").style.width = pct + "%";
    }

    function render() {
      const container = document.getElementById("sections-container");
      container.innerHTML = "";

      const sections = COURSES_DATA[currentCourse] || [];

      sections.forEach((sec, sIdx) => {
        // Filter items
        const filteredItems = sec.items.filter(it => {
          if (activeFilter === "video" && it.type !== "video") return false;
          if (activeFilter === "pdf" && it.type !== "pdf") return false;
          if (searchQuery) {
            const matchTitle = (it.title || "").toLowerCase().includes(searchQuery);
            const matchCapt = (it.caption || "").toLowerCase().includes(searchQuery);
            const matchSec = (sec.name || "").toLowerCase().includes(searchQuery);
            return matchTitle || matchCapt || matchSec;
          }
          return true;
        });

        if (filteredItems.length === 0) return;

        const secCard = document.createElement("div");
        secCard.className = "section-card" + (searchQuery || sIdx === 0 ? " expanded" : "");
        secCard.id = "sec-" + sIdx;

        let secDone = 0;
        filteredItems.forEach(it => {
          if (completedItems.has(String(it.id))) secDone++;
        });

        secCard.innerHTML = `
          <div class="section-header" onclick="toggleSection(${sIdx})">
            <div class="section-title">
              <span>📚</span>
              <span>${sec.name}</span>
            </div>
            <div class="section-meta">
              <span class="count-badge">${secDone}/${filteredItems.length}</span>
              <span class="arrow-icon">▼</span>
            </div>
          </div>
          <div class="section-content">
            ${filteredItems.map(it => {
              const isDone = completedItems.has(String(it.id));
              const icon = it.type === "video" ? "🎥" : (it.type === "pdf" ? "📄" : "📎");
              const btnLabel = it.type === "video" ? "Play" : "Open";
              return `
                <div class="item-card ${isDone ? 'completed' : ''}" id="item-${it.id}">
                  <div class="check-btn" onclick="toggleComplete(${it.id}, event)"></div>
                  <div class="item-icon">${icon}</div>
                  <div class="item-details">
                    <div class="item-title" title="${it.title}">${it.title}</div>
                    <div class="item-sub">
                      <span>${it.type.toUpperCase()}</span>
                      ${it.size_str ? `<span>• ${it.size_str}</span>` : ''}
                    </div>
                  </div>
                  <button class="play-btn" onclick="openItem('${it.link}')">
                    ${btnLabel}
                  </button>
                </div>
              `;
            }).join("")}
          </div>
        `;
        container.appendChild(secCard);
      });

      updateProgress();
    }

    render();
  </script>
