                p.subcategories.forEach((ed, edIdx) => {
                    if (ed.name.toLowerCase().includes(q)) {
                        matches.push({ type: 'Edition / Course', title: ed.name, subtitle: `${p.name} • ${ed.badge}`, icon: 'fa-solid fa-folder-open', url: ed.url });
                    }
                    if (ed.topics) {
                        ed.topics.forEach(t => {
                            if (t.name && t.name.toLowerCase().includes(q)) {
                                matches.push({ type: 'Subject', title: t.name, subtitle: `${p.name} - ${ed.name}`, icon: 'fa-solid fa-graduation-cap', link: t.link });
                            }
                        });
                    }
                });
            });

            // Search QBs
            APP_DATA.qbCategories.forEach(cat => {
                cat.topics.forEach(top => {
                    top.videos.forEach(v => {
                        if (v.title.toLowerCase().includes(q) || v.subject.toLowerCase().includes(q)) {
                            matches.push({ type: 'Live QB', title: v.title, subtitle: `${v.platform} • ${v.subject}`, icon: 'fa-solid fa-file-circle-check', link: v.telegram_link, isQb: true });
                        }
                    });
                });
            });

            let html = `
                <div class="section-header">
                    <span class="section-title"><i class="fa-solid fa-magnifying-glass"></i> Search Results</span>
                    <span class="section-count">${matches.length} Matches</span>
                </div>
            `;

            if (matches.length === 0) {
                html += `
                    <div class="empty-state">
                        <i class="fa-solid fa-box-open empty-icon"></i>
                        <p>No results found for "${q}"</p>
                    </div>
                `;
            } else {
                html += `<div class="list-container">`;
                matches.slice(0, 50).forEach(m => {
                    html += `
                        <div class="subject-card">
                            <div class="subject-left">
                                <div class="subject-icon-box">${renderFaIcon(m.icon, 'fa-solid fa-magnifying-glass')}</div>
                                <div class="subject-details">
                                    <div class="subject-name">${m.title}</div>
                                    <div class="subject-faculty">${m.subtitle}</div>
                                    <div class="subject-meta">${m.type}</div>
                                </div>
                            </div>
                            ${m.link || m.url ? `<a href="${m.link || m.url}" target="_blank" class="btn-action ${m.isQb ? 'btn-qb' : ''}"><span>Open</span> <i class="fa-solid fa-arrow-up-right-from-square"></i></a>` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // Initial Render
        render();
    </script>
</body>
</html>
